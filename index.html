<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Train With FIFS | Maryland Firearms Training Platform</title>
<meta content="Maryland firearms training platform designed to build knowledge, safety, and confidence without intimidation. State-approved HQL, Wear &amp; Carry, and private coaching with Lead Instructor Kai Wade." name="description"/>
<link href="https://drive.google.com/thumbnail?id=1EnAqEURi1XIRNdNTooFGY_pvs38ZcBEQ&amp;sz=w128" rel="icon" type="image/png"/>
<link href="https://drive.google.com/thumbnail?id=1EnAqEURi1XIRNdNTooFGY_pvs38ZcBEQ&amp;sz=w128" rel="shortcut icon"/>
<link href="https://drive.google.com/thumbnail?id=1EnAqEURi1XIRNdNTooFGY_pvs38ZcBEQ&amp;sz=w180" rel="apple-touch-icon"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&amp;family=Rajdhani:wght@500;600;700;800&amp;display=swap" rel="stylesheet"/>
<style>

    :root {

      --bg-dark-core: #070b10;

      --bg-dark-panel: #10161f;

      --bg-dark-card: rgba(16, 22, 31, 0.94);

      --accent-cyan: #00e5ff;

      --accent-cyan-glow: rgba(0, 229, 255, 0.45);

      --accent-amber: #ffb703;

      --accent-amber-glow: rgba(255, 183, 3, 0.35);

      --accent-green: #10b981;

      --accent-red: #ef4444;

      --text-main: #f8fafc;

      --text-muted: #cbd5e1;

      --border-subtle: #1e293b;

      --font-display: 'Rajdhani', sans-serif;

      --font-body: 'Inter', system-ui, -apple-system, sans-serif;

    }

  
  
  
  
  
  
  
  

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    html { scroll-behavior: smooth; overscroll-behavior-y: none; }

    body { overscroll-behavior-y: none; font-family: var(--font-body); color: var(--text-main); background-color: var(--bg-dark-core); min-height: 100vh; line-height: 1.5; overflow-x: hidden; }

  
  
  
  
  
  
  
  

    /* ================= SCREEN 1: HERO LANDING ================= */

    #hero-landing {
      position: relative;
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px 18px;
      text-align: center;
      background-color: var(--bg-dark-core);
      overflow-x: hidden;
      overflow-y: auto;
      z-index: 10;
    }

  
  
  
  
  
  
  
  

    .hero-bg-layer { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none !important; overflow: hidden; }

    .hero-bg-artwork { width: 100%; height: 100%; object-fit: cover; object-position: center top; display: block; pointer-events: none !important; }

    @media (min-width: 601px) { .hero-bg-artwork { object-fit: contain; object-position: center top; height: 100%; } }

    .hero-bg-vignette { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(7, 11, 16, 0.3) 0%, transparent 28%, rgba(7, 11, 16, 0.65) 70%, var(--bg-dark-core) 100%); pointer-events: none !important; }

  
  
  
  
  
  
  
  

    /* Blinking Pulse Light & Ticker */

    .hero-top-hud { width: 100%; max-width: 760px; display: flex; flex-direction: column; align-items: center; z-index: 20; position: relative; margin-top: 4px; }

    .range-live-ticker {

      display: inline-flex; align-items: center; gap: 8px; background: rgba(7, 11, 16, 0.85); backdrop-filter: blur(10px);

      border: 1px solid rgba(0, 229, 255, 0.35); padding: 6px 16px; border-radius: 20px; font-family: var(--font-display);

      font-size: 0.84rem; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: #fff; box-shadow: 0 0 16px rgba(0, 229, 255, 0.2);

    }

    .pulse-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: var(--accent-green); box-shadow: 0 0 10px var(--accent-green); animation: livePulseGreen 1.8s infinite ease-in-out; }

    @keyframes livePulseGreen { 0%, 100% { transform: scale(1); opacity: 1; box-shadow: 0 0 10px #10b981; } 50% { transform: scale(1.35); opacity: 0.4; box-shadow: 0 0 18px #10b981; } }

  
  
  
  
  
  
  
  

    .hero-mid-spacer {
      pointer-events: none !important;
      flex: 0;
      height: 10px;
      min-height: 5px;
      z-index: 5;
    }

  
  
  
  
  
  
  
  

    /* Command Dock */

    .hero-command-dock {
      width: 100%; max-width: 620px; background: rgba(11, 15, 20, 0.94);
      z-index: 50 !important; pointer-events: auto !important; touch-action: manipulation; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);

      padding: 16px 16px 14px; border-radius: 18px; border: 1px solid rgba(0, 229, 255, 0.45);

      box-shadow: 0 16px 45px rgba(0, 0, 0, 0.92), 0 0 25px rgba(0, 229, 255, 0.25);

      position: relative; display: flex; flex-direction: column; gap: 10px; z-index: 30; margin-top: auto; pointer-events: auto !important;

    }

    .hero-command-dock::before, .hero-command-dock::after { content: ''; position: absolute; width: 14px; height: 14px; border-color: var(--accent-cyan); pointer-events: none; }

    .hero-command-dock::before { top: -2px; left: -2px; border-top: 2px solid var(--accent-cyan); border-left: 2px solid var(--accent-cyan); border-top-left-radius: 8px; }

    .hero-command-dock::after { bottom: -2px; right: -2px; border-bottom: 2px solid var(--accent-cyan); border-right: 2px solid var(--accent-cyan); border-bottom-right-radius: 8px; }

  
  
  
  
  
  
  
  

    .btn-hero-booking-prime {

      width: 100%; background: linear-gradient(135deg, #00e5ff 0%, #0099cc 100%); color: #070b10; border: none; border-radius: 12px;

      padding: 16px 18px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;

      box-shadow: 0 0 24px var(--accent-cyan-glow), 0 4px 14px rgba(0, 0, 0, 0.6); transition: all 0.25s ease; pointer-events: auto !important;

    }

    .btn-hero-booking-prime:hover { transform: translateY(-2px) scale(1.01); box-shadow: 0 0 34px rgba(0, 229, 255, 0.7); background: linear-gradient(135deg, #4deeea 0%, #00e5ff 100%); }

    .prime-label { font-family: var(--font-display); font-size: 1.35rem; font-weight: 800; letter-spacing: 1.8px; text-transform: uppercase; line-height: 1.1; }

    .prime-sub { font-family: var(--font-body); font-size: 0.78rem; font-weight: 700; letter-spacing: 0.6px; color: #051622; text-transform: uppercase; }

  
  
  
  
  
  
  
  

    .hero-twin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .btn-hero-twin {
      pointer-events: auto !important; touch-action: manipulation; cursor: pointer; user-select: none; -webkit-user-select: none;
      background: #0d121a; border: 1px solid rgba(0, 229, 255, 0.35); border-radius: 10px; padding: 12px 10px; color: #fff; cursor: pointer;

      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; transition: all 0.2s ease; min-height: 64px; text-align: center;

    }

    .btn-hero-twin:hover { background: rgba(0, 229, 255, 0.15); border-color: var(--accent-cyan); box-shadow: 0 0 14px var(--accent-cyan-glow); transform: translateY(-2px); }

    .twin-title { font-family: var(--font-display); font-size: 1rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: #fff; }

    .twin-sub { font-size: 0.72rem; color: var(--accent-cyan); text-transform: uppercase; font-weight: 600; }

  
  
  
  
  
  
  
  

    .hero-bottom-strip { display: flex; justify-content: center; align-items: center; gap: 14px; border-top: 1px solid rgba(255, 255, 255, 0.08); padding-top: 8px; }

    .btn-hero-aux { pointer-events: auto !important; touch-action: manipulation; cursor: pointer; user-select: none; -webkit-user-select: none; background: none; border: none; color: var(--text-muted); font-family: var(--font-display); font-size: 0.88rem; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; transition: color 0.2s; }

    .btn-hero-aux:hover { color: var(--accent-cyan); }

  
  
  
  
  
  
  
  

    .admin-secret-lock {

      position: fixed; bottom: 12px; right: 12px; width: 32px; height: 32px; border-radius: 50%;

      background: rgba(16, 22, 31, 0.6); border: 1px solid rgba(255, 255, 255, 0.12); color: var(--text-muted);

      display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 14px; opacity: 0.35; transition: all 0.25s; z-index: 100;

    }

    .admin-secret-lock:hover { opacity: 1; border-color: var(--accent-cyan); color: var(--accent-cyan); transform: scale(1.1); }

  
  
  
  
  
  
  
  

    /* ================= SCREEN 2: MAIN APPLICATION CONTAINER ================= */

    #app-container { display: none; width: 100%; max-width: 1080px; margin: 0 auto; padding: 20px 16px 80px; animation: fadeIn 0.35s ease forwards; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

  
  
  
  
  
  
  
  

    .app-header {

      display: flex; justify-content: space-between; align-items: center; padding: 14px 20px; background: var(--bg-dark-panel);

      border: 1px solid var(--border-subtle); border-radius: 12px; margin-bottom: 24px; gap: 12px;

    }

    .brand-identity-group { display: flex; align-items: center; gap: 12px; }

    .app-nav-logo { width: 44px; height: 44px; object-fit: contain; filter: drop-shadow(0 0 8px var(--accent-cyan-glow)); }

    .app-brand-text h2 { font-family: var(--font-display); font-size: 1.3rem; letter-spacing: 1.5px; color: #fff; line-height: 1.1; }

    .app-brand-text p { font-size: 0.72rem; color: var(--accent-cyan); letter-spacing: 1px; text-transform: uppercase; }

  
  
  
  
  
  
  
  

    /* High-Visibility Luminous Home Button */

    .btn-return-home {

      display: inline-flex; align-items: center; justify-content: center; gap: 10px;

      background: linear-gradient(135deg, #00e5ff 0%, #00b4d8 100%); color: #030a14 !important;

      font-family: var(--font-display); font-size: 1.15rem; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase;

      padding: 12px 24px; border-radius: 10px; border: 2px solid #ffffff; cursor: pointer;

      box-shadow: 0 0 22px rgba(0, 229, 255, 0.75), 0 4px 14px rgba(0, 0, 0, 0.6); transition: all 0.25s ease; min-height: 48px;

    }

    .btn-return-home:hover {

      background: linear-gradient(135deg, #ffffff 0%, #00e5ff 100%); color: #02070f !important;

      transform: translateY(-2px) scale(1.03); box-shadow: 0 0 32px rgba(0, 229, 255, 0.95);

    }

    .btn-sign-out { background: rgba(255, 255, 255, 0.06); border: 1px solid var(--border-subtle); color: var(--text-muted); font-family: var(--font-display); font-size: 0.85rem; padding: 6px 14px; border-radius: 6px; cursor: pointer; }

    .btn-sign-out:hover { color: #ff6b6b; border-color: #ff6b6b; background: rgba(255, 107, 107, 0.12); }

  
  
  
  
  
  
  
  

    

    /* Instructor Profile Card */

    .instructor-hero-card {

      display: flex;

      flex-direction: column;

      align-items: center;

      gap: 22px;

      background: #0d121a;

      border: 1px solid rgba(0, 229, 255, 0.35);

      border-radius: 16px;

      padding: 22px;

      margin-bottom: 24px;

      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6), 0 0 20px rgba(0, 229, 255, 0.12);

    }

    @media (min-width: 680px) {

      .instructor-hero-card {

        flex-direction: row;

        align-items: center;

        text-align: left;

      }

    }

    .instructor-avatar-frame {

      width: 220px;

      height: 275px;

      border-radius: 16px;

      overflow: hidden;

      border: 2px solid var(--accent-cyan);

      box-shadow: 0 0 25px var(--accent-cyan-glow), inset 0 0 20px rgba(0, 0, 0, 0.8);

      background: #070b10;

      flex-shrink: 0;

      position: relative;

    }

    .instructor-avatar-img {

      width: 100%;

      height: 100%;

      object-fit: cover;

      object-position: center top;

      transform: scale(2.15) translate(0.5%, 19%);

      transform-origin: center center;

      display: block;

      transition: transform 0.35s ease;

    }

    .instructor-avatar-frame:hover .instructor-avatar-img {

      transform: scale(2.22) translate(0.5%, 19%);

    }

    .instructor-avatar-frame::after {

      content: '';

      position: absolute;

      inset: 0;

      border-radius: 14px;

      background: radial-gradient(circle at 50% 36%, transparent 50%, rgba(7, 11, 16, 0.72) 100%),

                  linear-gradient(180deg, transparent 65%, rgba(7, 11, 16, 0.95) 100%);

      pointer-events: none;

    }

    .instructor-hero-info { flex: 1; }

    .instructor-badge-tag {

      display: inline-block;

      background: rgba(0, 229, 255, 0.12);

      border: 1px solid var(--accent-cyan);

      color: var(--accent-cyan);

      font-family: var(--font-display);

      font-size: 0.82rem;

      font-weight: 700;

      padding: 3px 10px;

      border-radius: 4px;

      text-transform: uppercase;

      letter-spacing: 1px;

      margin-bottom: 6px;

    }

    .instructor-name {

      font-family: var(--font-display);

      font-size: 1.85rem;

      font-weight: 800;

      color: #fff;

      line-height: 1.15;

      margin-bottom: 6px;

      letter-spacing: 1px;

    }

    .instructor-creds-sub {

      font-size: 0.88rem;

      color: var(--accent-amber);

      font-weight: 600;

      margin-bottom: 10px;

      line-height: 1.4;

    }

    .instructor-tagline {

      font-size: 0.92rem;

      color: #cbd5e1;

      font-style: italic;

      line-height: 1.55;

    }

  
  
  
  
  
  
  
  

    

    /* View Utility Classes */

    #hero-landing.hidden-view { display: none !important; }

    #app-container.active-view { display: block !important; }

  
  
  
  
  
  
  
  

    /* Semi-Transparent Neon Arrow Guide */

    .neon-arrow-guide-wrap {

      display: flex;

      justify-content: center;

      align-items: center;

      margin-bottom: 2px;

      cursor: pointer;

      pointer-events: auto !important;

      animation: neonGuideBounce 2.2s infinite ease-in-out;

      user-select: none;

      -webkit-user-select: none;

    }

    @keyframes neonGuideBounce {

      0%, 100% { transform: translateY(0); }

      50% { transform: translateY(5px); }

    }

  
  
  
  
  
  
  
  

    .neon-arrow-badge {

      display: inline-flex;

      align-items: center;

      justify-content: center;

      gap: 10px;

      padding: 7px 20px;

      border-radius: 24px;

      font-family: var(--font-display);

      font-size: 0.92rem;

      font-weight: 800;

      letter-spacing: 1.4px;

      text-transform: uppercase;

      backdrop-filter: blur(10px);

      -webkit-backdrop-filter: blur(10px);

      transition: all 0.3s ease;

      cursor: pointer;

      pointer-events: auto !important;

    }

  
  
  
  
  
  
  
  

    /* Cyan Operating Mode (Colors of the business logo: #00e5ff) */

    .neon-arrow-badge.neon-mode-cyan {

      background: rgba(0, 229, 255, 0.12);

      border: 1px solid var(--accent-cyan);

      color: #00e5ff;

      box-shadow: 0 0 18px rgba(0, 229, 255, 0.45), inset 0 0 10px rgba(0, 229, 255, 0.2);

      animation: neonCyanPulse 2s infinite ease-in-out;

    }

    .neon-arrow-badge.neon-mode-cyan .neon-arrow-icon {

      color: #00e5ff;

      filter: drop-shadow(0 0 6px rgba(0, 229, 255, 0.8));

    }

    .neon-arrow-badge.neon-mode-cyan:hover {

      background: rgba(0, 229, 255, 0.22);

      box-shadow: 0 0 28px rgba(0, 229, 255, 0.8), inset 0 0 16px rgba(0, 229, 255, 0.35);

      transform: scale(1.02);

    }

    @keyframes neonCyanPulse {

      0%, 100% {

        box-shadow: 0 0 14px rgba(0, 229, 255, 0.4), inset 0 0 8px rgba(0, 229, 255, 0.18);

        border-color: rgba(0, 229, 255, 0.7);

        color: #00e5ff;

      }

      50% {

        box-shadow: 0 0 26px rgba(0, 229, 255, 0.85), inset 0 0 14px rgba(0, 229, 255, 0.35);

        border-color: #ffffff;

        color: #ffffff;

      }

    }

  
  
  
  
  
  
  
  

    /* Red Standby Mode (Off-hours before 9 AM or after 9 PM EST) */

    .neon-arrow-badge.neon-mode-red {

      background: rgba(239, 68, 68, 0.14);

      border: 1px solid #ef4444;

      color: #ef4444;

      box-shadow: 0 0 18px rgba(239, 68, 68, 0.45), inset 0 0 10px rgba(239, 68, 68, 0.2);

      animation: neonRedPulse 2s infinite ease-in-out;

    }

    .neon-arrow-badge.neon-mode-red .neon-arrow-icon {

      color: #ef4444;

      filter: drop-shadow(0 0 6px rgba(239, 68, 68, 0.8));

    }

    .neon-arrow-badge.neon-mode-red:hover {

      background: rgba(239, 68, 68, 0.22);

      box-shadow: 0 0 28px rgba(239, 68, 68, 0.8), inset 0 0 16px rgba(239, 68, 68, 0.35);

      transform: scale(1.02);

    }

    @keyframes neonRedPulse {

      0%, 100% {

        box-shadow: 0 0 14px rgba(239, 68, 68, 0.4), inset 0 0 8px rgba(239, 68, 68, 0.18);

        border-color: rgba(239, 68, 68, 0.7);

        color: #ef4444;

      }

      50% {

        box-shadow: 0 0 26px rgba(239, 68, 68, 0.85), inset 0 0 14px rgba(239, 68, 68, 0.35);

        border-color: #fca5a5;

        color: #ffffff;

      }

    }

  
  
  
  
  
  
  
  

    .neon-arrow-icon {

      font-size: 0.95rem;

      line-height: 1;

      display: inline-block;

      animation: chevronDip 1.2s infinite ease-in-out;

    }

    @keyframes chevronDip {

      0%, 100% { transform: translateY(0); }

      50% { transform: translateY(3px); }

    }

  
  
  
  
  
  
  
  

    /* Panels */

    .panel { background: var(--bg-dark-card); border: 1px solid var(--border-subtle); border-radius: 16px; padding: 24px 20px; margin-bottom: 24px; box-shadow: 0 12px 36px rgba(0, 0, 0, 0.45); }

    .panel-header { margin-bottom: 20px; border-left: 3px solid var(--accent-cyan); padding-left: 14px; }
    .panel-header h3 {
      font-family: var(--font-display);
      font-size: clamp(1.25rem, 4vw, 1.55rem);
      letter-spacing: 1px;
      color: #fff;
      white-space: normal !important;
      word-break: break-word;
      overflow-wrap: break-word;
      overflow: visible;
      line-height: 1.35;
      margin-bottom: 6px;
    }
    .panel-header p {
      font-size: 0.88rem;
      color: var(--text-muted);
      white-space: normal !important;
      line-height: 1.55;
    }

  
  
  
  
  
  
  
  

    /* Pathways */

    .pathway-selector-box { background: #0d121a; border: 1px solid var(--border-subtle); border-radius: 14px; padding: 18px; margin-bottom: 24px; }

    .pathway-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin-top: 12px; }

    .pathway-pill { background: #070b10; border: 1px solid var(--border-subtle); border-radius: 10px; padding: 14px; text-align: center; cursor: pointer; transition: all 0.2s; display: flex; flex-direction: column; justify-content: space-between; }

    .pathway-pill:hover { border-color: var(--accent-cyan); transform: translateY(-2px); box-shadow: 0 6px 18px var(--accent-cyan-glow); }

    .pathway-intent { font-family: var(--font-display); font-size: 0.82rem; font-weight: 700; color: var(--accent-amber); text-transform: uppercase; margin-bottom: 4px; }

    .pathway-rec { font-family: var(--font-display); font-size: 1.05rem; font-weight: 800; color: #fff; margin-bottom: 6px; }

    .pathway-cta { font-size: 0.74rem; color: var(--accent-cyan); text-transform: uppercase; font-weight: 600; }

  
  
  
  
  
  
  
  

    /* Course Cards */

    .tuition-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; margin-bottom: 28px; }

    .tuition-card { background: #0d131b; border: 1px solid var(--border-subtle); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; cursor: pointer; transition: all 0.25s; position: relative; }

    .tuition-card:hover { border-color: var(--accent-cyan); transform: translateY(-2px); box-shadow: 0 4px 18px var(--accent-cyan-glow); }

    .tuition-card.featured { border-color: var(--accent-amber); background: linear-gradient(135deg, rgba(255, 183, 3, 0.05) 0%, rgba(13, 19, 27, 0.95) 100%); }

    .tuition-title { font-family: var(--font-display); font-size: 1.25rem; font-weight: 700; color: #fff; margin-bottom: 4px; }

    .tuition-price { font-family: var(--font-display); font-size: 1.8rem; font-weight: 800; color: var(--accent-cyan); margin-bottom: 8px; }

    .tuition-desc { font-size: 0.84rem; color: var(--text-muted); line-height: 1.5; margin-bottom: 14px; }

    .btn-select-course { background: rgba(0, 229, 255, 0.1); border: 1px solid var(--accent-cyan); color: var(--accent-cyan); font-family: var(--font-display); font-size: 0.9rem; font-weight: 700; padding: 8px 12px; border-radius: 6px; text-align: center; text-transform: uppercase; }

    .tuition-card:hover .btn-select-course { background: var(--accent-cyan); color: #070b10; }

  
  
  
  
  
  
  
  

    /* Journey Grid */

    .journey-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; margin-bottom: 24px; }

    .j-card { background: #0d121a; border: 1px solid var(--border-subtle); border-radius: 12px; padding: 16px; }

    .j-num { font-family: var(--font-display); font-size: 1.8rem; font-weight: 800; color: rgba(0, 229, 255, 0.3); line-height: 1; margin-bottom: 4px; }

    .j-title { font-family: var(--font-display); font-size: 1.15rem; font-weight: 700; color: #fff; text-transform: uppercase; margin-bottom: 4px; }

    .j-desc { font-size: 0.82rem; color: var(--text-muted); line-height: 1.45; }

  
  
  
  
  
  
  
  

    /* What to Bring Checklist Boxes */

    .checklist-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; margin-bottom: 24px; }

    .checklist-box { background: #0d131b; border: 1px solid rgba(0, 229, 255, 0.25); border-radius: 12px; padding: 18px; }

    .checklist-box h4 { font-family: var(--font-display); font-size: 1.15rem; color: var(--accent-cyan); margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }

    .checklist-box ul { list-style: none; font-size: 0.86rem; color: var(--text-muted); line-height: 1.6; }

    .checklist-box li { margin-bottom: 6px; display: flex; align-items: flex-start; gap: 8px; }

    .checklist-box li::before { content: '✔'; color: var(--accent-amber); font-weight: bold; }

  
  
  
  
  
  
  
  

    /* Forms */

    .form-group { margin-bottom: 16px; }

    label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; }

    label span.req { color: var(--accent-cyan); }

    input[type="text"], input[type="email"], input[type="tel"], input[type="password"], select, textarea {

      width: 100%; background: #070b10; border: 1px solid var(--border-subtle); border-radius: 8px; padding: 12px 14px; color: #fff; font-family: var(--font-body); font-size: 1rem; min-height: 46px;

    }

    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent-cyan); box-shadow: 0 0 10px var(--accent-cyan-glow); }

    textarea { resize: vertical; min-height: 85px; }

  
  
  
  
  
  
  
  

    .btn-primary { width: 100%; background: var(--accent-cyan); color: #070b10; font-family: var(--font-display); font-size: 1.15rem; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; padding: 14px 20px; border: none; border-radius: 8px; cursor: pointer; box-shadow: 0 0 16px var(--accent-cyan-glow); min-height: 48px; }

    .status-msg { display: none; padding: 12px; border-radius: 8px; margin-top: 14px; font-size: 0.9rem; }

    .status-msg.success { display: block; background: rgba(0, 229, 255, 0.12); border: 1px solid var(--accent-cyan); color: #4deeea; }

    .status-msg.error { display: block; background: rgba(239, 68, 68, 0.15); border: 1px solid #ef4444; color: #fca5a5; }

  
  
  
  
  
  
  
  

    /* Student Portal Styles */

    .student-badge-bar { background: linear-gradient(135deg, #10161f 0%, #0d131b 100%); border: 1px solid rgba(0, 229, 255, 0.35); border-radius: 14px; padding: 16px 20px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }

    .student-meta-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }

    .meta-chip { background: #070b10; border: 1px solid rgba(0, 229, 255, 0.25); color: var(--accent-cyan); font-family: var(--font-display); font-size: 0.82rem; padding: 3px 10px; border-radius: 4px; text-transform: uppercase; font-weight: 700; }

    .meta-chip.chip-status { background: rgba(255, 183, 3, 0.12); border-color: var(--accent-amber); color: var(--accent-amber); }

  
  
  
  
  
  
  
  

    .next-step-card { background: linear-gradient(135deg, rgba(0, 229, 255, 0.12) 0%, rgba(16, 22, 31, 0.95) 100%); border: 2px solid var(--accent-cyan); box-shadow: 0 0 24px var(--accent-cyan-glow); border-radius: 14px; padding: 22px 20px; margin-bottom: 24px; }

    .next-step-badge { font-family: var(--font-display); font-size: 0.82rem; font-weight: 800; letter-spacing: 1.5px; color: var(--accent-cyan); text-transform: uppercase; margin-bottom: 4px; }

    .next-step-title { font-family: var(--font-display); font-size: 1.35rem; font-weight: 800; color: #fff; margin-bottom: 6px; }

    .next-step-desc { font-size: 0.90rem; color: var(--text-muted); line-height: 1.55; margin-bottom: 16px; }

  
  
  
  
  
  
  
  

    .progress-track-wrapper { background: #0d121a; border: 1px solid var(--border-subtle); border-radius: 14px; padding: 16px; margin-bottom: 24px; }

    .progress-steps-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; margin-top: 10px; }

    .track-step-node { background: #10161f; border: 1px solid var(--border-subtle); border-radius: 8px; padding: 8px; text-align: center; font-size: 0.75rem; color: var(--text-muted); }

    .track-step-node.completed { border-color: #10b981; color: #10b981; background: rgba(16, 185, 129, 0.1); }

    .track-step-node.active { border-color: var(--accent-cyan); color: var(--accent-cyan); background: rgba(0, 229, 255, 0.12); font-weight: 700; }

  
  
  
  
  
  
  
  

    .interactive-checklist { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }

    .task-item-card { background: #0d131b; border: 1px solid rgba(0, 229, 255, 0.2); border-radius: 10px; padding: 14px 16px; display: flex; align-items: flex-start; gap: 12px; cursor: pointer; transition: all 0.2s; }

    .task-item-card.is-done { background: rgba(16, 185, 129, 0.08); border-color: #10b981; }

    .task-checkbox { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--accent-cyan); cursor: pointer; }

  
  
  
  
  
  
  
  

    /* Admin Styles */

    .admin-metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 24px; }

    .metric-card { background: #0d131b; border: 1px solid rgba(0, 229, 255, 0.25); border-radius: 12px; padding: 16px; text-align: center; }

    .metric-val { font-family: var(--font-display); font-size: 2rem; font-weight: 800; color: var(--accent-cyan); }

    .metric-name { font-size: 0.8rem; text-transform: uppercase; color: var(--text-muted); font-weight: 600; }

    .admin-roster-table { width: 100%; border-collapse: collapse; font-size: 0.86rem; margin-top: 12px; }

    .admin-roster-table th, .admin-roster-table td { padding: 12px 10px; text-align: left; border-bottom: 1px solid var(--border-subtle); }

    .admin-roster-table th { background: #070b10; color: var(--accent-cyan); font-family: var(--font-display); font-size: 0.85rem; letter-spacing: 1px; text-transform: uppercase; }

  
  
  
  
  
  
  
  

    /* Target Cards */

    .gallery-grid-targets { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; margin-top: 20px; }

    .target-card-student { background: #0d121a; border: 1px solid rgba(0, 229, 255, 0.28); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.65); transition: transform 0.25s, border-color 0.25s; }

    .target-card-student:hover { transform: translateY(-3px); border-color: var(--accent-cyan); }

    .target-img-frame { width: 100%; height: 330px; background-color: #070b10; position: relative; overflow: hidden; }

    .target-img-frame img { width: 100%; height: 100%; object-fit: cover; object-position: center 20%; display: block; }

    .badge-course { position: absolute; bottom: 10px; left: 10px; background: rgba(7, 11, 16, 0.92); border: 1px solid var(--accent-cyan); color: var(--accent-cyan); font-family: var(--font-display); font-size: 0.80rem; font-weight: 700; padding: 4px 10px; border-radius: 4px; text-transform: uppercase; }

    .badge-score { position: absolute; top: 10px; right: 10px; background: var(--accent-amber); color: #070b10; font-family: var(--font-display); font-weight: 700; font-size: 0.80rem; padding: 4px 10px; border-radius: 4px; }

    .target-content { padding: 16px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }

  
  
  
  
  
  
  
  

    /* Review CTA */

    .cta-review-box { background: linear-gradient(135deg, rgba(255, 183, 3, 0.12) 0%, rgba(16, 22, 31, 0.95) 100%); border: 1px solid var(--accent-amber); box-shadow: 0 0 16px var(--accent-amber-glow); border-radius: 14px; padding: 20px; text-align: center; margin-bottom: 24px; }

    .btn-review { display: inline-flex; align-items: center; justify-content: center; background: var(--accent-amber); color: #070b10; font-family: var(--font-display); font-size: 1.05rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; padding: 12px 24px; border-radius: 8px; text-decoration: none; margin-top: 10px; }

  
  
  
  
  
  
  
  

    /* FAQ */

    .faq-item { background: #0d131b; border: 1px solid var(--border-subtle); border-radius: 10px; margin-bottom: 10px; overflow: hidden; }

    .faq-question {
      width: 100%;
      background: none;
      border: none;
      padding: 16px 18px;
      font-family: var(--font-display);
      font-size: clamp(0.95rem, 2.8vw, 1.12rem);
      font-weight: 700;
      color: #fff;
      text-align: left;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      white-space: normal !important;
      word-break: break-word;
      overflow-wrap: break-word;
      overflow: visible;
      line-height: 1.4;
    }

    .faq-answer { display: none; padding: 0 18px 16px; font-size: 0.88rem; color: var(--text-muted); line-height: 1.6; border-top: 1px solid rgba(255, 255, 255, 0.05); padding-top: 12px; }

    .faq-item.active .faq-answer { display: block; }

  
  
  
  
  
  
  
  

    .spark-dock { background: #10161f; border: 1px solid var(--accent-cyan); border-radius: 12px; padding: 16px; margin-top: 28px; text-align: center; }

    .spark-btn-group { display: flex; gap: 10px; justify-content: center; margin-top: 10px; flex-wrap: wrap; }

    .btn-spark { background: rgba(0, 229, 255, 0.1); border: 1px solid var(--accent-cyan); color: var(--accent-cyan); font-family: var(--font-display); font-size: 0.95rem; padding: 8px 16px; border-radius: 6px; cursor: pointer; }

  
  
  
  
  
  
  
  

    .hidden { display: none !important; }

  
  
  
  

/* ================= INTERACTIVE SVG US MAP STYLING ================= */

    .reciprocity-map-container {

      width: 100%;

      background: #070b10;

      border: 1px solid var(--border-subtle);

      border-radius: 12px;

      padding: 16px;

      margin-bottom: 20px;

      overflow-x: auto;

      text-align: center;

      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.8);

    }

    .svg-us-map {

      width: 100%;

      max-width: 900px;

      height: auto;

      display: block;

      margin: 0 auto;

      user-select: none;

    }

    .svg-state-node {

      cursor: pointer;

      transition: all 0.25s ease;

    }

    .svg-state-node rect {

      stroke-width: 1.5;

      rx: 6;

      ry: 6;

      transition: all 0.2s ease;

    }

    .svg-state-node:hover rect {

      stroke-width: 2.5;

      filter: brightness(1.25) drop-shadow(0 0 10px rgba(0, 229, 255, 0.8));

    }

    .svg-state-node.state-constitutional rect {

      fill: #0c4a6e;

      stroke: #38bdf8;

    }

    .svg-state-node.state-honored rect {

      fill: #064e3b;

      stroke: #10b981;

    }

    .svg-state-node.state-not-honored rect {

      fill: rgba(239, 68, 68, 0.22);

      stroke: #ef4444;

      stroke-width: 1.8;

      opacity: 0.95;

    }

    .svg-state-node.state-not-honored:hover rect {

      fill: rgba(239, 68, 68, 0.45);

      stroke: #ff4d4d;

      stroke-width: 2.5;

    }

    .svg-state-node text.state-code-label {

      font-family: var(--font-display);

      font-size: 13px;

      font-weight: 800;

      fill: #ffffff;

      pointer-events: none;

      text-anchor: middle;

      dominant-baseline: central;

    }

    .svg-state-node text.state-sub-label {

      font-family: var(--font-body);

      font-size: 8px;

      font-weight: 700;

      fill: #cbd5e1;

      pointer-events: none;

      text-anchor: middle;

      dominant-baseline: central;

    }

  
  
  
  

    /* Car Travel Corridor Strip */

    .car-travel-corridor-box {

      background: #0d121a;

      border: 1px solid rgba(0, 229, 255, 0.25);

      border-radius: 12px;

      padding: 16px;

      margin-bottom: 20px;

    }

    .corridor-header {

      font-family: var(--font-display);

      font-size: 1.15rem;

      font-weight: 800;

      color: #fff;

      display: flex;

      align-items: center;

      gap: 8px;

      margin-bottom: 6px;

    }

    .corridor-desc {

      font-size: 0.86rem;

      color: var(--text-muted);

      line-height: 1.5;

      margin-bottom: 12px;

    }

    .corridor-routes-grid {

      display: grid;

      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));

      gap: 12px;

    }

    .corridor-route-card {

      background: #070b10;

      border: 1px solid var(--border-subtle);

      border-radius: 8px;

      padding: 12px;

    }

    .corridor-route-title {

      font-family: var(--font-display);

      font-size: 0.98rem;

      font-weight: 800;

      color: var(--accent-cyan);

      margin-bottom: 4px;

    }

    .corridor-route-flow {

      font-size: 0.80rem;

      color: #e2e8f0;

      line-height: 1.5;

    }

  
  
  
  

    /* ================= FLYING WITH A FIREARM MODULE ================= */

    .flying-firearm-module {

      background: linear-gradient(135deg, rgba(16, 22, 31, 0.95) 0%, rgba(7, 11, 16, 0.98) 100%);

      border: 1px solid var(--accent-amber);

      box-shadow: 0 0 24px var(--accent-amber-glow);

      border-radius: 16px;

      padding: 24px 20px;

      margin-top: 24px;

      margin-bottom: 28px;

    }

    .flying-header-box {

      border-left: 3px solid var(--accent-amber);

      padding-left: 14px;

      margin-bottom: 18px;

    }

    .flying-header-box h3 {

      font-family: var(--font-display);

      font-size: 1.5rem;

      font-weight: 800;

      color: #fff;

      display: flex;

      align-items: center;

      gap: 10px;

    }

    .flying-header-box p {

      font-size: 0.88rem;

      color: var(--text-muted);

      margin-top: 4px;

    }

    .flying-steps-grid {

      display: grid;

      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));

      gap: 14px;

      margin-bottom: 20px;

    }

    .flying-step-card {

      background: #070b10;

      border: 1px solid var(--border-subtle);

      border-radius: 10px;

      padding: 16px;

      position: relative;

    }

    .flying-step-num {

      font-family: var(--font-display);

      font-size: 1.8rem;

      font-weight: 800;

      color: rgba(255, 183, 3, 0.35);

      line-height: 1;

      margin-bottom: 4px;

    }

    .flying-step-title {

      font-family: var(--font-display);

      font-size: 1.1rem;

      font-weight: 700;

      color: #fff;

      margin-bottom: 6px;

    }

    .flying-step-desc {

      font-size: 0.84rem;

      color: var(--text-muted);

      line-height: 1.55;

    }

    .flying-warning-banner {

      background: rgba(239, 68, 68, 0.12);

      border: 1px solid #ef4444;

      border-radius: 10px;

      padding: 16px;

      display: flex;

      align-items: flex-start;

      gap: 12px;

    }

    .flying-warning-icon {

      font-size: 1.6rem;

      color: #ef4444;

      flex-shrink: 0;

    }

    .flying-warning-text h4 {

      font-family: var(--font-display);

      font-size: 1.1rem;

      color: #fff;

      font-weight: 800;

      margin-bottom: 4px;

    }

    .flying-warning-text p {

      font-size: 0.85rem;

      color: #fca5a5;

      line-height: 1.55;

    }

  
  
  
  

    /* ================= MULTI-STATE CCW RECIPROCITY APP ================= */

    .portal-reciprocity-wrapper {

      background: linear-gradient(135deg, rgba(16, 22, 31, 0.98) 0%, rgba(7, 11, 16, 0.99) 100%);

      border: 1px solid rgba(0, 229, 255, 0.35);

      border-radius: 16px;

      padding: 24px 20px;

      margin-top: 28px;

      margin-bottom: 28px;

      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.75), 0 0 20px rgba(0, 229, 255, 0.15);

      position: relative;

    }

    .reciprocity-header-box {

      border-left: 3px solid var(--accent-cyan);

      padding-left: 14px;

      margin-bottom: 20px;

    }

    .reciprocity-header-box h3 {

      font-family: var(--font-display);

      font-size: 1.55rem;

      font-weight: 800;

      color: #fff;

      letter-spacing: 1px;

      display: flex;

      align-items: center;

      gap: 10px;

    }

    .reciprocity-header-box p {

      font-size: 0.88rem;

      color: var(--text-muted);

      margin-top: 4px;

      line-height: 1.5;

    }

  
  
  
  

    /* Multi-Permit Selection Bar */

    .reciprocity-permit-selector {

      background: #0d121a;

      border: 1px solid var(--border-subtle);

      border-radius: 12px;

      padding: 16px;

      margin-bottom: 20px;

    }

    .permit-picker-row {

      display: flex;

      flex-wrap: wrap;

      gap: 16px;

      align-items: center;

      margin-bottom: 12px;

    }

    .permit-picker-group {

      flex: 1;

      min-width: 240px;

    }

    .permit-picker-group label {

      font-size: 0.82rem;

      font-weight: 700;

      color: var(--accent-cyan);

      text-transform: uppercase;

      letter-spacing: 0.5px;

      margin-bottom: 6px;

      display: block;

    }

    .permit-addons-label {

      font-size: 0.80rem;

      font-weight: 700;

      color: var(--accent-amber);

      text-transform: uppercase;

      letter-spacing: 0.5px;

      margin-bottom: 8px;

      display: block;

    }

    .permit-chip-grid {

      display: flex;

      flex-wrap: wrap;

      gap: 8px;

    }

    .permit-chip {

      background: #070b10;

      border: 1px solid var(--border-subtle);

      border-radius: 20px;

      padding: 6px 14px;

      font-family: var(--font-display);

      font-size: 0.85rem;

      font-weight: 700;

      color: var(--text-muted);

      cursor: pointer;

      display: inline-flex;

      align-items: center;

      gap: 6px;

      transition: all 0.2s;

      user-select: none;

    }

    .permit-chip:hover {

      border-color: var(--accent-cyan);

      color: #fff;

    }

    .permit-chip.selected {

      background: rgba(0, 229, 255, 0.15);

      border-color: var(--accent-cyan);

      color: #00e5ff;

      box-shadow: 0 0 10px rgba(0, 229, 255, 0.25);

    }

    .permit-chip.selected::before {

      content: '✔';

      color: #10b981;

      font-weight: bold;

    }

  
  
  
  

    /* Live Coverage Scorecard Bar */

    .reciprocity-scorecard {

      display: grid;

      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));

      gap: 12px;

      margin-bottom: 22px;

    }

    .scorecard-metric-card {

      background: #070b10;

      border: 1px solid var(--border-subtle);

      border-radius: 10px;

      padding: 14px 16px;

      text-align: center;

    }

    .scorecard-metric-card.highlight {

      border-color: var(--accent-cyan);

      background: linear-gradient(180deg, rgba(0, 229, 255, 0.08) 0%, #070b10 100%);

    }

    .scorecard-val {

      font-family: var(--font-display);

      font-size: 1.9rem;

      font-weight: 800;

      color: var(--accent-cyan);

      line-height: 1.1;

    }

    .scorecard-val.green { color: #10b981; }

    .scorecard-val.blue { color: #38bdf8; }

    .scorecard-val.red { color: #ef4444; }

    .scorecard-label {

      font-size: 0.74rem;

      font-weight: 700;

      text-transform: uppercase;

      color: var(--text-muted);

      letter-spacing: 0.5px;

      margin-top: 4px;

    }

  
  
  
  

    /* Color Legend */

    .reciprocity-legend-bar {

      display: flex;

      flex-wrap: wrap;

      align-items: center;

      justify-content: center;

      gap: 14px;

      background: #070b10;

      border: 1px solid var(--border-subtle);

      border-radius: 10px;

      padding: 10px 16px;

      margin-bottom: 20px;

      font-size: 0.80rem;

    }

    .legend-item {

      display: flex;

      align-items: center;

      gap: 6px;

      font-weight: 600;

    }

    .legend-dot {

      width: 12px;

      height: 12px;

      border-radius: 3px;

      display: inline-block;

    }

    .legend-dot.dot-constitutional {

      background: #38bdf8;

      box-shadow: 0 0 8px rgba(56, 189, 248, 0.6);

    }

    .legend-dot.dot-honored {

      background: #10b981;

      box-shadow: 0 0 8px rgba(16, 185, 129, 0.6);

    }

    .legend-dot.dot-special {

      background: #ffb703;

      box-shadow: 0 0 8px rgba(255, 183, 3, 0.6);

    }

    .legend-dot.dot-not-honored {

      background: #334155;

      border: 1px solid #64748b;

    }

  
  
  
  

    /* Search & Filter Controls */

    .reciprocity-filter-controls {

      display: flex;

      flex-wrap: wrap;

      gap: 10px;

      justify-content: space-between;

      align-items: center;

      margin-bottom: 16px;

    }

    .search-state-input {

      background: #070b10;

      border: 1px solid var(--border-subtle);

      border-radius: 8px;

      color: #fff;

      padding: 8px 14px;

      font-size: 0.88rem;

    .brand-hud-header::after {
      content: '';
      position: absolute;
      bottom: -2px; right: -2px;
      width: 16px; height: 16px;
      border-bottom: 2px solid var(--accent-cyan);
      border-right: 2px solid var(--accent-cyan);
      border-bottom-right-radius: 8px;
    }

    .brand-info-block h1 {
      font-family: var(--font-display);
      font-size: 1.85rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 10px;
      text-transform: uppercase;
    }
    .brand-info-block p {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 4px;
    }
    .badge-instructor {
      display: inline-block;
      background: rgba(0, 229, 255, 0.12);
      border: 1px solid var(--accent-cyan);
      color: var(--accent-cyan);
      font-family: var(--font-display);
      font-size: 0.78rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .live-status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(7, 11, 16, 0.9);
      border: 1px solid rgba(16, 185, 129, 0.4);
      padding: 6px 14px;
      border-radius: 20px;
      font-family: var(--font-display);
      font-size: 0.82rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .live-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--accent-green);
      box-shadow: 0 0 8px var(--accent-green);
      animation: pulseGreen 1.8s infinite;
    }
    @keyframes pulseGreen {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.3); }
    }

    /* Permit Management Panel */
    .permit-control-deck {
      background: var(--bg-panel);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 24px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }
    .section-title {
      font-family: var(--font-display);
      font-size: 1.25rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: 1px;
      text-transform: uppercase;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .section-title span.accent {
      color: var(--accent-cyan);
    }

    .permit-inputs-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }
    @media (min-width: 768px) {
      .permit-inputs-grid {
        grid-template-columns: 1fr 2fr;
      }
    }

    .permit-field-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }
    .permit-select-main {
      width: 100%;
      background: #070b10;
      border: 1px solid var(--accent-cyan);
      border-radius: 8px;
      padding: 12px 14px;
      color: #fff;
      font-family: var(--font-body);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      outline: none;
      transition: all 0.2s;
    }
    .permit-select-main:focus {
      box-shadow: 0 0 12px var(--accent-cyan-glow);
    }

    .multiplier-chips-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .multiplier-chip {
      background: #070b10;
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
      user-select: none;
    }
    .multiplier-chip:hover {
      border-color: var(--accent-cyan);
      color: #fff;
      transform: translateY(-1px);
    }
    .multiplier-chip.active {
      background: rgba(0, 229, 255, 0.14);
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
      box-shadow: 0 0 12px var(--accent-cyan-glow);
    }
    .multiplier-chip .chip-check {
      width: 14px; height: 14px;
      border-radius: 50%;
      border: 1px solid var(--text-dim);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
    }
    .multiplier-chip.active .chip-check {
      background: var(--accent-cyan);
      border-color: var(--accent-cyan);
      color: #070b10;
    }

    /* Scorecard */
    .scorecard-hud-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }
    .scorecard-card {
      background: var(--bg-panel);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 14px 16px;
      text-align: center;
      position: relative;
      overflow: hidden;
      transition: transform 0.2s;
    }
    .scorecard-card:hover {
      transform: translateY(-2px);
    }
    .scorecard-card.highlight {
      border-color: var(--accent-cyan);
      background: linear-gradient(135deg, rgba(0, 229, 255, 0.08) 0%, rgba(13, 18, 26, 0.95) 100%);
      box-shadow: 0 0 20px rgba(0, 229, 255, 0.15);
    }
    .scorecard-card .metric-val {
      font-family: var(--font-display);
      font-size: 2.1rem;
      font-weight: 800;
      line-height: 1;
      margin-bottom: 4px;
    }
    .scorecard-card .metric-val.green { color: var(--accent-green); text-shadow: 0 0 12px var(--accent-green-glow); }
    .scorecard-card .metric-val.cyan { color: var(--accent-cyan); text-shadow: 0 0 12px var(--accent-cyan-glow); }
    .scorecard-card .metric-val.blue { color: var(--accent-blue); }
    .scorecard-card .metric-val.amber { color: var(--accent-amber); }
    .scorecard-card .metric-val.red { color: var(--accent-red); text-shadow: 0 0 12px var(--accent-red-glow); }
    .scorecard-card .metric-lbl {
      font-size: 0.76rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Map Legend Bar */
    .map-legend-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 16px;
      background: var(--bg-panel);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 10px 16px;
      margin-bottom: 20px;
      font-size: 0.82rem;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
      transition: opacity 0.2s;
    }
    .legend-color-box {
      width: 14px; height: 14px;
      border-radius: 4px;
      flex-shrink: 0;
    }
    .box-constitutional { background: #0284c7; border: 1px solid #38bdf8; }
    .box-honored { background: #059669; border: 1px solid #10b981; }
    .box-special { background: #d97706; border: 1px solid #f59e0b; }
    .box-not-honored { background: #dc2626; border: 1px solid #ef4444; }

    /* Search & Filter bar */
    .filter-search-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .search-input-box {
      background: #070b10;
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 10px 14px;
      color: #fff;
      font-size: 0.9rem;
      width: 100%;
      max-width: 320px;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-input-box:focus {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 10px var(--accent-cyan-glow);
    }
    .filter-pills-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .filter-btn-pill {
      background: #0d121a;
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
      text-transform: uppercase;
    }
    .filter-btn-pill:hover {
      border-color: var(--accent-cyan);
      color: #fff;
    }
    .filter-btn-pill.active {
      background: var(--accent-cyan);
      color: #070b10;
      border-color: var(--accent-cyan);
      font-weight: 800;
    }

    /* Map Viewport Container */
    .map-display-container {
      background: #070b10;
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 24px;
      box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.9), 0 10px 25px rgba(0, 0, 0, 0.5);
      position: relative;
    }
    .map-header-indicator {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-family: var(--font-display);
      font-size: 0.85rem;
      color: var(--accent-cyan);
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .svg-canvas-wrapper {
      width: 100%;
      overflow-x: auto;
      text-align: center;
    }
    .interactive-us-svg {
      width: 100%;
      max-width: 960px;
      height: auto;
      display: block;
      margin: 0 auto;
      user-select: none;
    }

    /* SVG State Shapes and Pins */
    .svg-state-group {
      cursor: pointer;
      transition: transform 0.2s ease, filter 0.2s ease;
    }
    .svg-state-group:hover {
      filter: drop-shadow(0 0 12px rgba(0, 229, 255, 0.85));
    }
    .state-bg-rect {
      stroke-width: 1.5;
      rx: 6; ry: 6;
      transition: all 0.25s ease;
    }
    .svg-state-group:hover .state-bg-rect {
      stroke: #fff !important;
      stroke-width: 2.5;
      filter: brightness(1.25);
    }
    .svg-state-group.selected .state-bg-rect {
      stroke: var(--accent-cyan) !important;
      stroke-width: 3;
      filter: drop-shadow(0 0 10px var(--accent-cyan));
    }
    .state-code-text {
      font-family: var(--font-display);
      font-size: 14px;
      font-weight: 800;
      fill: #ffffff;
      text-anchor: middle;
      dominant-baseline: central;
      pointer-events: none;
    }
    .state-status-indicator {
      font-size: 11px;
      pointer-events: none;
      text-anchor: middle;
      dominant-baseline: central;
    }

    /* Dynamic Category Styles for SVG */
    .status-constitutional .state-bg-rect {
      fill: #0c4a6e;
      stroke: #38bdf8;
    }
    .status-honored .state-bg-rect {
      fill: #064e3b;
      stroke: #10b981;
    }
    .status-special .state-bg-rect {
      fill: #78350f;
      stroke: #f59e0b;
    }
    .status-not-honored .state-bg-rect {
      fill: rgba(239, 68, 68, 0.22);
      stroke: #ef4444;
      stroke-width: 1.8;
    }

    /* Selected State Focus Deck (Reverse engineered from Reference 00:00 - 00:04) */
    .selected-state-banner {
      background: var(--bg-panel);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 20px 24px;
      margin-bottom: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }
    .state-banner-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 12px;
    }
    .banner-meta-col .sub-reciprocity {
      font-family: var(--font-display);
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: var(--text-muted);
      text-transform: uppercase;
    }
    .banner-meta-col .main-state-name {
      font-family: var(--font-display);
      font-size: 2.3rem;
      font-weight: 800;
      color: #fff;
      line-height: 1.1;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .banner-meta-col .carry-verdict-text {
      font-size: 1.05rem;
      font-weight: 700;
      margin-top: 4px;
    }
    .carry-verdict-text.can-carry {
      color: var(--accent-green);
    }
    .carry-verdict-text.cannot-carry {
      color: var(--accent-red);
    }
    .carry-verdict-text.special-carry {
      color: var(--accent-amber);
    }

    .btn-inspect-gun-laws {
      background: transparent;
      border: 2px solid var(--accent-amber);
      color: var(--accent-amber);
      font-family: var(--font-display);
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 12px 24px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.25s;
      box-shadow: 0 0 14px var(--accent-amber-glow);
    }
    .btn-inspect-gun-laws:hover {
      background: var(--accent-amber);
      color: #070b10;
      box-shadow: 0 0 24px rgba(255, 183, 3, 0.7);
      transform: translateY(-2px);
    }

    /* Neighbor Quick State Cards (from Reference 00:01 - 00:04) */
    .neighbor-cards-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 10px;
    }
    .neighbor-state-card {
      background: #070b10;
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 12px 14px;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }
    .neighbor-state-card:hover {
      border-color: var(--accent-cyan);
      transform: translateY(-2px);
      box-shadow: 0 4px 14px var(--accent-cyan-glow);
    }
    .neighbor-state-card .n-code {
      font-family: var(--font-display);
      font-size: 1.4rem;
      font-weight: 800;
      color: #fff;
    }
    .neighbor-state-card .n-verdict {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
    }
    .neighbor-state-card .n-verdict.can { color: var(--accent-green); }
    .neighbor-state-card .n-verdict.cannot { color: var(--accent-red); }
    .neighbor-state-card .n-verdict.special { color: var(--accent-amber); }

    /* Active Permits List Card (from Reference 00:03 - 00:04) */
    .my-permits-card {
      background: var(--bg-panel);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 20px 24px;
      margin-bottom: 24px;
    }
    .my-permits-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .my-permits-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
    }
    .permit-row-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #070b10;
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 12px 16px;
    }
    .permit-row-item .permit-name-tag {
      font-family: var(--font-display);
      font-size: 1.1rem;
      font-weight: 800;
      color: #fff;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .permit-status-badge-circle {
      width: 24px; height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 900;
    }
    .badge-primary-resident {
      border: 2px solid var(--accent-cyan);
      color: var(--accent-cyan);
      background: rgba(0, 229, 255, 0.1);
    }
    .badge-multiplier {
      border: 2px solid var(--accent-green);
      color: var(--accent-green);
      background: rgba(16, 185, 129, 0.1);
    }

    .btn-add-permit {
      width: 100%;
      background: linear-gradient(135deg, #ffb703 0%, #e6a100 100%);
      color: #070b10;
      border: none;
      border-radius: 8px;
      font-family: var(--font-display);
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 12px;
      cursor: pointer;
      box-shadow: 0 0 16px var(--accent-amber-glow);
      transition: all 0.25s;
    }
    .btn-add-permit:hover {
      box-shadow: 0 0 26px rgba(255, 183, 3, 0.8);
      transform: translateY(-2px);
    }

    /* Vertical State Reciprocity Scroller (Reverse engineered from Reference 00:14 - 00:23) */
    .vertical-reciprocity-scroller-box {
      background: linear-gradient(135deg, rgba(16, 22, 31, 0.98) 0%, rgba(7, 11, 16, 0.99) 100%);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 24px 20px;
      margin-bottom: 24px;
      text-align: center;
    }
    .scroller-head-title {
      font-family: var(--font-display);
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--accent-amber);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .scroller-subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 18px;
    }
    .roller-viewport-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      margin: 16px 0 24px;
      position: relative;
    }
    .vertical-state-roller {
      width: 90px;
      height: 200px;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scrollbar-width: thin;
      scrollbar-color: var(--accent-cyan) #070b10;
      border-left: 2px dashed rgba(255, 183, 3, 0.4);
      padding-left: 14px;
    }
    .roller-item {
      height: 40px;
      display: flex;
      align-items: center;
      font-family: var(--font-display);
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-dim);
      cursor: pointer;
      scroll-snap-align: center;
      transition: all 0.2s;
    }
    .roller-item:hover {
      color: var(--accent-cyan);
    }
    .roller-item.active {
      color: #fff;
      font-size: 1.55rem;
      font-weight: 800;
      text-shadow: 0 0 10px rgba(0, 229, 255, 0.6);
    }
    .roller-selected-display {
      flex: 1;
      max-width: 480px;
      text-align: left;
      background: #070b10;
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 16px 20px;
    }
    .roller-selected-display .rd-title {
      font-family: var(--font-display);
      font-size: 1.35rem;
      font-weight: 800;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
    }
    .roller-selected-display .rd-desc {
      font-size: 0.88rem;
      color: var(--text-muted);
      line-height: 1.45;
      margin-bottom: 12px;
    }
    .btn-roller-next {
      background: var(--accent-cyan);
      color: #070b10;
      border: none;
      border-radius: 8px;
      font-family: var(--font-display);
      font-size: 0.95rem;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 8px 16px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-roller-next:hover {
      background: #fff;
      box-shadow: 0 0 16px var(--accent-cyan-glow);
    }

    /* Travel Corridor Guide Box */
    .highway-corridors-box {
      background: var(--bg-panel);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 24px;
    }
    .corridor-header {
      font-family: var(--font-display);
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--accent-cyan);
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .corridor-cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 14px;
    }
    .corridor-route-card {
      background: #070b10;
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 14px 16px;
    }
    .corridor-route-card h4 {
      font-family: var(--font-display);
      font-size: 1.05rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 6px;
    }
    .corridor-route-card p {
      font-size: 0.82rem;
      color: var(--text-muted);
      line-height: 1.45;
    }

    /* Modal / Drawer for Gun Laws (Reverse engineered from Reference 00:05 - 00:09) */
    .state-drawer-overlay {
      position: fixed;
      inset: 0;
      background: rgba(7, 11, 16, 0.88);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 9999999;
      display: none;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .state-drawer-overlay.open {
      display: flex;
      animation: modalFadeIn 0.25s ease forwards;
    }
    @keyframes modalFadeIn {
      from { opacity: 0; transform: scale(0.98); }
      to { opacity: 1; transform: scale(1); }
    }

    .state-drawer-modal {
      background: #0d121a;
      border: 1px solid var(--border-cyan);
      border-radius: 18px;
      width: 100%;
      max-width: 720px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.95), 0 0 30px rgba(0, 229, 255, 0.25);
      position: relative;

    function toggleFormTier(targetTier) {
      const selectElem = document.getElementById('courseSelection');
      if (!selectElem) return;

      const currentVal = selectElem.value;
      const isCurrentlyVip = currentVal.includes('VIP') || currentVal.includes('Turnkey');

      if (targetTier === 'vip' && !isCurrentlyVip) {
        for (let i = 0; i < selectElem.options.length; i++) {
          const opt = selectElem.options[i].value;
          if ((opt.includes('VIP') || opt.includes('Turnkey')) && (
            (currentVal.includes('Multi-State') && opt.includes('Multi-State')) ||
            (currentVal.includes('Combo') && opt.includes('Combo')) ||
            (currentVal.includes('Wear & Carry') && opt.includes('Wear & Carry') && !opt.includes('Combo')) ||
            (currentVal.includes('HQL') && opt.includes('HQL') && !opt.includes('Combo')) ||
            (currentVal.includes('1-on-1') && opt.includes('1-on-1')) ||
            (currentVal.includes('Cleaning') && opt.includes('Cleaning')) ||
            (currentVal.includes('Children') && opt.includes('Children'))
          )) {
            selectElem.selectedIndex = i;
            selectElem.value = opt;
            break;
          }
        }
      } else if (targetTier === 'base' && isCurrentlyVip) {
        for (let i = 0; i < selectElem.options.length; i++) {
          const opt = selectElem.options[i].value;
          if (!opt.includes('VIP') && !opt.includes('Turnkey') && (
            (currentVal.includes('Multi-State') && opt.includes('Multi-State')) ||
            (currentVal.includes('Combo') && opt.includes('Combo')) ||
            (currentVal.includes('Wear & Carry') && opt.includes('Wear & Carry') && !opt.includes('Combo')) ||
            (currentVal.includes('HQL') && opt.includes('HQL') && !opt.includes('Combo')) ||
            (currentVal.includes('1-on-1') && opt.includes('1-on-1')) ||
            (currentVal.includes('Cleaning') && opt.includes('Cleaning')) ||
            (currentVal.includes('Children') && opt.includes('Children'))
          )) {
            selectElem.selectedIndex = i;
            selectElem.value = opt;
            break;
          }
        }
      }
      updateFormPriceDisplay();
    }
    window.toggleFormTier = toggleFormTier;

    function generateCoachWadeReply(msg) {
      const m = msg.toLowerCase();
      if (m.includes('cost') || m.includes('price') || m.includes('tuition') || m.includes('how much')) {
        return "Our courses start at $100 for Maryland HQL and $249.99 for the complete Wear & Carry + HQL Combo (which saves you $100). All classes include live-fire practical range qualification at Cindy's Hot Shots. You can view full transparent pricing in our course catalog!";
      }
      if (m.includes('schedule') || m.includes('date') || m.includes('when') || m.includes('weekend') || m.includes('weekday')) {
        return "We offer flexible scheduling: Standard courses run on Saturdays & Sundays, while VIP Turnkey enrollments unlock 7-day flexible scheduling (Monday through Sunday anytime) to match your personal schedule!";
      }
      if (m.includes('range') || m.includes('location') || m.includes('where')) {

    function renderBookingCalendar() {
      const grid = document.getElementById('bookingCalDaysGrid');
      const label = document.getElementById('bookingCalMonthLabel');
      const policyBanner = document.getElementById('calendarPolicyText');
      if (!grid || !label) return;

      const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
      label.textContent = `${monthNames[calCurrentMonth]} ${calCurrentYear}`;

      const selectElem = document.getElementById('courseSelection');
      const curVal = (selectElem ? selectElem.value : '').toLowerCase();
      const isVip = curVal.includes('vip') || curVal.includes('turnkey');

      if (policyBanner) {
        if (isVip) {
          policyBanner.innerHTML = '👑 <strong style="color: var(--accent-amber);">VIP Turnkey Perk:</strong> Priority <strong>7-Day Flexible Scheduling (Monday–Sunday)</strong> is unlocked! Select any open date below.';
          policyBanner.style.borderColor = 'var(--accent-amber)';
          policyBanner.style.background = 'rgba(255, 183, 3, 0.08)';
        } else {
          policyBanner.innerHTML = '📅 <strong>Standard Schedule:</strong> Classes held on <strong>Saturdays &amp; Sundays</strong>. Weekdays (Mon–Fri) locked. (Toggle to 👑 VIP to unlock 7-day flexible scheduling).';
          policyBanner.style.borderColor = 'var(--accent-cyan)';
          policyBanner.style.background = 'rgba(0, 229, 255, 0.08)';
        }
      }

      grid.innerHTML = '';

      const firstDay = new Date(calCurrentYear, calCurrentMonth, 1).getDay();
      const totalDays = new Date(calCurrentYear, calCurrentMonth + 1, 0).getDate();

      // Empty leading cells
      for (let i = 0; i < firstDay; i++) {
        const emptyCell = document.createElement('div');
        emptyCell.style.background = '#070b10';
        emptyCell.style.minHeight = '42px';
        grid.appendChild(emptyCell);
      }

      const today = new Date();
      today.setHours(0, 0, 0, 0);

      for (let d = 1; d <= totalDays; d++) {
        const cellDate = new Date(calCurrentYear, calCurrentMonth, d);
        cellDate.setHours(0, 0, 0, 0);
        const dayOfWeek = cellDate.getDay(); // 0 = Sun, 6 = Sat
        const isWeekend = (dayOfWeek === 0 || dayOfWeek === 6);
        const dateKey = `${calCurrentYear}-${String(calCurrentMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        const isBooked = calBookedDates.includes(dateKey);
        const isPast = cellDate < today;

        const cell = document.createElement('div');
        cell.style.background = '#0d1219';
        cell.style.minHeight = '42px';
        cell.style.display = 'flex';
        cell.style.flexDirection = 'column';
        cell.style.alignItems = 'center';
        cell.style.justifyContent = 'center';
        cell.style.fontSize = '0.86rem';
        cell.style.fontWeight = '700';
        cell.style.cursor = 'pointer';
        cell.style.transition = 'all 0.15s ease';
        cell.setAttribute("data-date", dateKey);
        cell.textContent = d;

        if (isPast) {
          cell.style.color = '#334155';
          cell.style.cursor = 'not-allowed';
          cell.title = 'Past date';
        } else if (isBooked) {
          cell.style.color = '#ef4444';
          cell.style.cursor = 'not-allowed';
          cell.title = 'Class session already booked for this date';
          cell.innerHTML = `${d}<span style="width: 5px; height: 5px; border-radius: 50%; background: #ef4444; margin-top: 2px;"></span>`;
        } else if (!isVip && !isWeekend) {
          cell.style.color = '#334155';
          cell.style.background = '#080c11';
          cell.style.opacity = '0.25';
          cell.style.cursor = 'not-allowed';
          cell.style.pointerEvents = 'none';
          cell.title = 'Standard Base Track is locked to Saturdays & Sundays only. Upgrade to VIP Turnkey to unlock weekdays!';
          cell.innerHTML = `<span style="opacity: 0.35;">${d}</span><span style="font-size: 0.65rem; color: #475569; margin-top: 1px;">🔒</span>`;
        } else {
          // Available Date
          cell.style.color = '#fff';
          if (calSelectedDate === dateKey) {
            cell.style.background = isVip ? 'var(--accent-amber)' : 'var(--accent-cyan)';
            cell.style.color = '#070b10';
            cell.style.fontWeight = '900';
            cell.style.boxShadow = isVip ? '0 0 12px var(--accent-amber)' : '0 0 12px var(--accent-cyan)';
          } else {
            cell.onmouseover = function() {
              this.style.background = isVip ? 'rgba(255, 183, 3, 0.25)' : 'rgba(0, 229, 255, 0.25)';
            };
            cell.onmouseout = function() {
              this.style.background = '#0d1219';
            };
          }

          cell.onclick = function() {
            selectBookingDate(dateKey, cellDate, isVip);
          };
        }

        grid.appendChild(cell);
      }
    }

      const container = document.getElementById('admin-analytics-dashboard-container');
      if (!container) return;

      const telem = (serverData && serverData.telemetry) ? serverData.telemetry : (window.__serverTelemetry || null);
      if (telem) {
        window.__serverTelemetry = telem;
        const elVis = document.getElementById('telemetry-visitors-val');
        const elPv = document.getElementById('telemetry-pageviews-val');
        const elConv = document.getElementById('telemetry-conversion-val');
        const elVip = document.getElementById('telemetry-vip-val');
        const elMiles = document.getElementById('telemetry-milestones-val');

        if (elVis) elVis.textContent = Number(telem.totalVisitors || 0).toLocaleString();
        if (elPv) elPv.textContent = Number(telem.totalPageviews || 0).toLocaleString();
        if (elConv) elConv.textContent = telem.conversionRate || "0.0%";
        if (elVip) elVip.textContent = telem.vipCount || 0;
        if (elMiles) elMiles.textContent = telem.confirmedRegistrations || 0;

        const totalDev = (telem.deviceCounts["Mobile Phone"] || 0) + (telem.deviceCounts["Tablet / iPad"] || 0) + (telem.deviceCounts["Desktop / Laptop"] || 0) + (telem.deviceCounts["Handheld PC"] || 0);
        const calcPct = (cnt) => totalDev > 0 ? Math.round((cnt / totalDev) * 100) : 0;

        const mobPct = calcPct(telem.deviceCounts["Mobile Phone"] || 0);
        const tabPct = calcPct(telem.deviceCounts["Tablet / iPad"] || 0);
        const deskPct = calcPct(telem.deviceCounts["Desktop / Laptop"] || 0);
        const handPct = calcPct(telem.deviceCounts["Handheld PC"] || 0);

        const setBar = (id, pct, cnt, label) => {
          const elP = document.getElementById(`telemetry-${id}-pct`);
          const elB = document.getElementById(`telemetry-${id}-bar`);

    function getStoredChatThreads() {
      try {
        const data = localStorage.getItem('fifs_live_chat_threads');
        if (data) return JSON.parse(data);
      } catch(e) {}
      return [];
    }

    function saveChatThreads(threads) {
      try {
        localStorage.setItem('fifs_live_chat_threads', JSON.stringify(threads));
        localStorage.setItem('fifs_live_chat_sync', Date.now().toString());
      } catch(e) {}
    }

    function recordVisitorChatMessage(name, phone, text) {
      const threads = getStoredChatThreads();
      const cleanPhone = (phone || '').replace(/\D/g, '');
      let thread = threads.find(t => t.senderPhone.replace(/\D/g, '') === cleanPhone || (t.senderName.toLowerCase() === name.toLowerCase()));

      const now = new Date();
      const timeStr = now.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });

      if (!thread) {
        thread = {
          id: 'thread_' + Date.now() + '_' + Math.floor(Math.random() * 1000),
          senderName: name || 'Valued Student',
          senderPhone: phone || 'No phone provided',
          lastUpdated: timeStr,
          unread: true,
          messages: []
        };
        threads.unshift(thread);
      } else {
        thread.lastUpdated = timeStr;
        thread.unread = true;
      }

      thread.messages.push({
        sender: 'user',
        senderName: name,
        text: text,
        time: timeStr
      });

      saveChatThreads(threads);

      // Broadcast to Admin Portal Live Console
      if (FIFS_CHAT_BROADCAST_CHANNEL) {
        FIFS_CHAT_BROADCAST_CHANNEL.postMessage({
          type: 'VISITOR_MESSAGE',
          chat: { name, phone, text, time: timeStr, threadId: thread.id }
        });
      }

      updateAdminChatBadgeCount();
      return thread;
    }
    window.recordVisitorChatMessage = recordVisitorChatMessage;

    function renderAdminChatConsole() {
      const inboxList = document.getElementById('admin-chat-inbox-list');
      const countBadge = document.getElementById('admin-chat-count-badge');
      if (!inboxList) return;

      const threads = getStoredChatThreads();
      if (countBadge) countBadge.textContent = `${threads.length} active`;

      if (threads.length === 0) {
        inboxList.innerHTML = '<div style="text-align: center; color: var(--text-muted); font-size: 0.82rem; padding: 24px 8px;">No incoming live chat inquiries yet. New chats appear here in real time.</div>';
        return;
      }

      inboxList.innerHTML = threads.map(t => {
        const isSelected = (window.__activeAdminChatThreadId === t.id);
        const lastMsg = t.messages && t.messages.length ? t.messages[t.messages.length - 1].text : '';
        const unreadIndicator = t.unread ? '<span style="width: 8px; height: 8px; border-radius: 50%; background: #ef4444; display: inline-block;"></span>' : '';

        return `
          <div onclick="selectAdminChatThread('${t.id}')" style="background: ${isSelected ? 'rgba(0, 229, 255, 0.12)' : '#0d131b'}; border: 1px solid ${isSelected ? 'var(--accent-cyan)' : 'var(--border-subtle)'}; border-radius: 8px; padding: 10px 12px; cursor: pointer; transition: all 0.2s ease;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
              <strong style="color: #fff; font-size: 0.90rem; display: inline-flex; align-items: center; gap: 6px;">
                ${unreadIndicator} ${escapeHtml(t.senderName)}
              </strong>
              <span style="font-size: 0.72rem; color: var(--text-muted);">${t.lastUpdated || ''}</span>
            </div>
            <div style="font-size: 0.76rem; color: var(--accent-cyan); margin-bottom: 4px;">📞 ${escapeHtml(t.senderPhone)}</div>

              ${escapeHtml(lastMsg)}

      // If active thread selected, update its message stream
      if (window.__activeAdminChatThreadId) {

      if (!window.__activeAdminChatThreadId) {

        return;
      }

      const threads = getStoredChatThreads();

      const now = new Date();
      const timeStr = now.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });

      thread.messages.push({
        sender: 'instructor',
        senderName: 'Coach Kai Wade',
        text: text,
        time: timeStr
      });
      thread.lastUpdated = timeStr;
      saveChatThreads(threads);

      if (FIFS_CHAT_BROADCAST_CHANNEL) {
        FIFS_CHAT_BROADCAST_CHANNEL.postMessage({
          type: 'INSTRUCTOR_REPLY',
          threadId: thread.id,
          text: text,

      sendClientDiscordAlert(

        `Coach Kai Wade dispatched a live reply to student **${thread.senderName}** (${thread.senderPhone}).`,
        [

      );

      input.value = '';
      renderActiveAdminChatMessages(thread);
      renderAdminChatConsole();
    }
