name: Verify Vercel Production Deployment

on:
  repository_dispatch:
    types:
      - vercel.deployment.ready

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: vercel-release-${{ github.event.client_payload.id || github.run_id }}
  cancel-in-progress: false

jobs:
  verify-production-deployment:
    name: Release verification
    # Explicitly ignore known preview events; missing environment metadata is a failure path.
    if: github.event.client_payload.environment == 'production' || !github.event.client_payload.environment
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out release-gate validators
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate evidence and report the deployment check
        env:
          GH_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_CHECK_ID: ${{ secrets.VERCEL_CHECK_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          REPOSITORY: ${{ github.repository }}
          DEPLOYMENT_ID: ${{ github.event.client_payload.id }}
          EVENT_SHA: ${{ github.event.client_payload.git.sha }}
          EVENT_ENVIRONMENT: ${{ github.event.client_payload.environment }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -Eeuo pipefail

          die() { echo "RELEASE_GATE_ERROR: $*" >&2; exit 1; }
          [[ -n "$VERCEL_TOKEN" ]] || die "VERCEL_TOKEN secret is missing; deployment check cannot be updated and remains blocking."
          [[ -n "$VERCEL_CHECK_ID" ]] || die "VERCEL_CHECK_ID secret is missing; deployment check cannot be created."
          [[ -n "$VERCEL_PROJECT_ID" ]] || die "VERCEL_PROJECT_ID secret is missing; project identity cannot be verified."
          [[ -n "$DEPLOYMENT_ID" ]] || die "Vercel dispatch omitted deployment ID; no deployment-specific check can be attached."

          VERCEL_QUERY=""
          if [[ -n "${VERCEL_TEAM_ID:-}" ]]; then VERCEL_QUERY="?teamId=${VERCEL_TEAM_ID}"; fi
          vercel_api() {
            local method="$1" path="$2" data="${3:-}"
            if [[ -n "$data" ]]; then
              curl --fail-with-body --silent --show-error --retry 2 --retry-all-errors --retry-delay 2 \
                -X "$method" "https://api.vercel.com${path}${VERCEL_QUERY}" \
                -H "Authorization: Bearer ${VERCEL_TOKEN}" -H 'Content-Type: application/json' --data "$data"
            else
              curl --fail-with-body --silent --show-error --retry 2 --retry-all-errors --retry-delay 2 \
                -X "$method" "https://api.vercel.com${path}${VERCEL_QUERY}" \
                -H "Authorization: Bearer ${VERCEL_TOKEN}" -H 'Content-Type: application/json'
            fi
          }
          gh_api() {
            gh api -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "$1"
          }

          # Create a run on this exact deployment before validating so every later failure
          # can be reported to Vercel. If creation itself fails, the configured required check
          # remains pending and the GitHub job fails visibly.
          CHECK_CREATE=$(jq -n --arg checkId "$VERCEL_CHECK_ID" '{checkId:$checkId}')
          if ! CHECK_RUN=$(vercel_api POST "/v2/deployments/${DEPLOYMENT_ID}/check-runs" "$CHECK_CREATE"); then
            die "Could not create the deployment-specific Vercel check run; promotion must remain blocked."
          fi
          CHECK_RUN_ID=$(jq -r '.id // empty' <<< "$CHECK_RUN")
          [[ -n "$CHECK_RUN_ID" ]] || die "Vercel did not return a check-run ID; check result cannot be reported."

          CHECK_FINISHED=0
          finish_check() {
            local conclusion="$1" title="$2" summary="$3"
            [[ "$CHECK_FINISHED" == 0 ]] || return 0
            local now output body response
            now=$(date +%s%3N)
            output=$(jq -n --arg title "$title" --arg summary "$summary" '{title:$title,summary:$summary}')
            body=$(jq -n --arg conclusion "$conclusion" --arg text "$summary" \
              --arg url "$WORKFLOW_URL" --arg externalId "$RUN_ID" --argjson completedAt "$now" --argjson output "$output" \
              '{status:"completed",conclusion:$conclusion,conclusionText:$text,externalUrl:$url,externalId:$externalId,completedAt:$completedAt,output:$output}')
            if response=$(vercel_api PATCH "/v2/deployments/${DEPLOYMENT_ID}/check-runs/${CHECK_RUN_ID}" "$body"); then
              if ! node scripts/release_gate_validation.js check-response "$response" "$CHECK_RUN_ID" "$DEPLOYMENT_ID" "$VERCEL_CHECK_ID" "$conclusion"; then
                echo "RELEASE_GATE_ERROR: Vercel API response did not confirm the exact completed check result; keep promotion blocked." >&2
                return 1
              fi
              CHECK_FINISHED=1
              echo "## Vercel deployment check: ${conclusion}" >> "$GITHUB_STEP_SUMMARY"
              echo "- Deployment ID: \`${DEPLOYMENT_ID}\`" >> "$GITHUB_STEP_SUMMARY"
              echo "- Deployment SHA: \`${EVENT_SHA:-missing}\`" >> "$GITHUB_STEP_SUMMARY"
              echo "- Vercel check-run ID: \`${CHECK_RUN_ID}\`" >> "$GITHUB_STEP_SUMMARY"
              echo "- Result: ${summary}" >> "$GITHUB_STEP_SUMMARY"
              echo "$response" | jq '{id,deploymentId,checkId,status,conclusion}' >> "$GITHUB_STEP_SUMMARY"
            else
              echo "RELEASE_GATE_ERROR: Unable to confirm Vercel check update; the Vercel check may remain pending. Do not promote manually." >&2
              echo "## Vercel deployment check update unavailable" >> "$GITHUB_STEP_SUMMARY"
              echo "The API update was not confirmed. Keep Production blocked and investigate deployment \`${DEPLOYMENT_ID}\`, check run \`${CHECK_RUN_ID}\`." >> "$GITHUB_STEP_SUMMARY"
              return 1
            fi
          }
          fail() {
            local reason="$1"
            echo "RELEASE_GATE_ERROR: ${reason}" >&2
            finish_check failed "Release verification failed" "$reason" || true
            exit 1
          }
          trap 'rc=$?; if [[ "$rc" != 0 && "$CHECK_FINISHED" == 0 ]]; then finish_check failed "Release verification workflow failed" "Unexpected workflow error (exit ${rc}); inspect the linked GitHub Actions run. This check must not be treated as passed." || true; fi' EXIT

          # Confirm Vercel accepted the run and that it belongs to the deployment in the event.
          [[ "$(jq -r '.deploymentId // empty' <<< "$CHECK_RUN")" == "$DEPLOYMENT_ID" ]] || fail "Vercel check run is not attached to the dispatch deployment."
          [[ "$(jq -r '.checkId // empty' <<< "$CHECK_RUN")" == "$VERCEL_CHECK_ID" ]] || fail "Vercel returned a different check definition than configured."

          [[ "$EVENT_ENVIRONMENT" == "production" ]] || fail "Dispatch environment is missing or is not production."
          [[ "$EVENT_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || fail "Vercel dispatch SHA is missing or malformed."

          if ! DEPLOYMENT=$(vercel_api GET "/v13/deployments/${DEPLOYMENT_ID}?withGitRepoInfo=true"); then
            fail "Unable to retrieve the exact Vercel deployment record."
          fi
          DEPLOYMENT_SHA=$(jq -r '.gitSource.sha // .meta.githubCommitSha // empty' <<< "$DEPLOYMENT")
          DEPLOYMENT_TARGET=$(jq -r '.target // empty' <<< "$DEPLOYMENT")
          DEPLOYMENT_PROJECT=$(jq -r '.projectId // empty' <<< "$DEPLOYMENT")
          [[ "$DEPLOYMENT_SHA" == "$EVENT_SHA" ]] || fail "Dispatch SHA does not match Vercel deployment git SHA."
          [[ "$DEPLOYMENT_TARGET" == "production" ]] || fail "The deployment record is not a Production target."
          DEPLOYMENT_READY_STATE=$(jq -r '.readyState // .state // empty' <<< "$DEPLOYMENT")
          [[ "$DEPLOYMENT_READY_STATE" == "READY" ]] || fail "Vercel deployment is not in READY state."
          [[ "$DEPLOYMENT_PROJECT" == "$VERCEL_PROJECT_ID" ]] || fail "Deployment belongs to a different Vercel project."

          # The target must be the exact merge commit for a PR merged into main.
          if ! PULLS=$(gh_api "/repos/${REPOSITORY}/commits/${EVENT_SHA}/pulls?per_page=100"); then
            fail "Could not identify the merged PR associated with the deployment SHA."
          fi
          PR=$(jq -c --arg sha "$EVENT_SHA" '[.[] | select(.base.ref == "main" and .merged_at != null and .merge_commit_sha == $sha)] | sort_by(.merged_at) | last // empty' <<< "$PULLS")
          [[ -n "$PR" ]] || fail "Deployment SHA is not the exact merge commit of a merged PR into main."
          PR_NUMBER=$(jq -r '.number' <<< "$PR")
          PR_HEAD_SHA=$(jq -r '.head.sha // empty' <<< "$PR")
          [[ "$PR_HEAD_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || fail "Merged PR head SHA is unavailable."

          # Wait a bounded period for CI, but accept only the newest run for this exact PR head.
          CI_DEADLINE=$((SECONDS + 900))
          CI_RUN=''
          while (( SECONDS < CI_DEADLINE )); do
            if ! RUNS=$(gh_api "/repos/${REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${PR_HEAD_SHA}&event=pull_request&per_page=100"); then
              fail "GitHub Actions CI run lookup failed."
            fi
            CI_RUN=$(jq -c --arg sha "$PR_HEAD_SHA" '[.workflow_runs[] | select(.head_sha == $sha and .event == "pull_request")] | sort_by(.created_at) | last // empty' <<< "$RUNS")
            if [[ -n "$CI_RUN" ]]; then
              CI_RUN_ID=$(jq -r '.id' <<< "$CI_RUN")
              if [[ "$(jq -r '.status' <<< "$CI_RUN")" == "completed" ]]; then
                [[ "$(jq -r '.conclusion // empty' <<< "$CI_RUN")" == "success" ]] || fail "Newest CI run for exact PR head ${PR_HEAD_SHA} did not pass."
                break
              fi
            fi
            sleep 30
          done
          [[ -n "$CI_RUN" && "$(jq -r '.status' <<< "$CI_RUN")" == "completed" && "$(jq -r '.conclusion // empty' <<< "$CI_RUN")" == "success" ]] || fail "No successful CI run for exact PR head within 15 minutes."

          CI_RUN_ID=$(jq -r '.id' <<< "$CI_RUN")
          CI_RUN_URL=$(jq -r '.html_url' <<< "$CI_RUN")
          if ! JOBS=$(gh_api "/repos/${REPOSITORY}/actions/runs/${CI_RUN_ID}/jobs?per_page=100"); then
            fail "Could not retrieve successful CI job and step evidence."
          fi
          EVIDENCE=$(jq -n --arg eventSha "$EVENT_SHA" --argjson deployment "$DEPLOYMENT" --argjson ciRun "$CI_RUN" --argjson ciJobs "$JOBS" --arg expectedProjectId "$VERCEL_PROJECT_ID" --arg expectedPrHeadSha "$PR_HEAD_SHA" \
            '{eventSha:$eventSha,deployment:$deployment,ciRun:$ciRun,ciJobs:$ciJobs,expectedProjectId:$expectedProjectId,expectedPrHeadSha:$expectedPrHeadSha}')
          if ! EVIDENCE_ERROR=$(printf '%s' "$EVIDENCE" | node scripts/release_gate_validation.js 2>&1); then
            fail "$EVIDENCE_ERROR"
          fi

          # Recheck live PR head and exact Actions run immediately before accepting evidence.
          if ! LIVE_PR=$(gh_api "/repos/${REPOSITORY}/pulls/${PR_NUMBER}"); then
            fail "Could not recheck the live PR head."
          fi
          [[ "$(jq -r '.head.sha // empty' <<< "$LIVE_PR")" == "$PR_HEAD_SHA" ]] || fail "PR head changed since the successful CI evidence was produced."
          if ! CONFIRMED_RUN=$(gh_api "/repos/${REPOSITORY}/actions/runs/${CI_RUN_ID}"); then
            fail "Could not recheck the exact CI run immediately before accepting it."
          fi
          [[ "$(jq -r '.head_sha // empty' <<< "$CONFIRMED_RUN")" == "$PR_HEAD_SHA" && "$(jq -r '.status // empty' <<< "$CONFIRMED_RUN")" == "completed" && "$(jq -r '.conclusion // empty' <<< "$CONFIRMED_RUN")" == "success" ]] || fail "CI run changed or no longer passes for the exact PR head."

          SUMMARY="Verified deployment SHA ${EVENT_SHA}; merged PR #${PR_NUMBER} head ${PR_HEAD_SHA}; successful CI run ${CI_RUN_ID} (${CI_RUN_URL}); required Node 22, install, typecheck, security tests, registration E2E, release-gate tests, and production build steps passed."
          finish_check succeeded "Release evidence verified" "$SUMMARY" || die "Could not confirm success update to the Vercel check; do not promote."
          trap - EXIT
